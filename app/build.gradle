plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.miplayfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.miplayfix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 这里的版本号应该是 1.1.0 (对应 API 101)
    compileOnly 'io.github.libxposed:api:1.1.0'
    annotationProcessor 'io.github.libxposed:api:1.1.0'
}