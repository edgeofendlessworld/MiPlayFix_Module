plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.miplayfix'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.miplayfix"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
 compileOnly "io.github.libxposed.api"
}