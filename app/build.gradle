plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xposed.miplayfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.xposed.miplayfix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 【关键修正 1】DexKit 包含 C++ 代码，必须指定 ABI。
        // 小米投屏通常运行在 64 位系统上，必须包含 arm64-v8a。
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // 【关键修正 2】如果找不到依赖，可能需要确保项目根目录的 settings.gradle 有 mavenCentral()
}

dependencies {
    // Xposed 官方 API (仅编译不打包)
    compileOnly 'de.robv.android.xposed:api:82'
    
    // 【关键新增】引入 DexKit (需要打包进 APK，所以用 implementation)
    // 它是方案二的核心逻辑实现库
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation 'org.smali:dexlib2:2.5.2'
}